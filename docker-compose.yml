# ════════════════════════════════════════════════════════════════════
#  سامانه جامع آفاق — استقرار کامل با یک دستور
#
#      docker compose up -d --build
#
#  ⚠ از دور «Release Hardening» سه رمز دیتابیس/شیء *اجباری* است (P0-1):
#      make env          ← ساخت .env از نمونه (chmod 600)
#      سپس مقادیر CHANGE_ME را عوض کنید (یا همه‌کاری: ./deploy-debian.sh)
#  بقیهٔ متغیرها پیش‌فرض دارند. برای توسعهٔ محلی با همان مقادیر نمونه:
#      ALLOW_WEAK_SECRETS=1 make up
#
#  ⚠ سیاست پروداکشن (گیت CI «دروازهٔ انتشار» همین را چک می‌کند):
#     · رمز دیتابیس/شیء بدون پیش‌فرض‌اند و compose بدون .env رد می‌شود
#     · پشتیبانِ پیش‌از‌مهاجرت در volume afagh_backups می‌ماند و راستی‌آزمایی می‌شود
#     · اسکیما فقط با مهاجرت نسخه‌دار (drizzle/*.sql) جلو می‌رود، نه drizzle-kit push
#     · حساب مدیر اولیه با رمز تصادفی و تغییر اجباری ساخته می‌شود (make admin)
#
#  قرارداد .env: پروداکشن = ریشهٔ ریپو (.env کنار همین فایل)؛
#  توسعهٔ محلی = afagh-next/.env (ساختهٔ install-docker.ps1/.sh) که فقط
#  زیرساخت dev در afagh-next/docker-compose.yml را تغذیه می‌کند.
#
#      app       → Next.js            روی ${APP_BIND:-127.0.0.1}:${APP_PORT:-8080} (پشت پروکسی/Caddy)
#      postgres  → PostgreSQL 16      فقط روی 127.0.0.1
#      redis     → Redis 7            فقط روی 127.0.0.1
#      minio     → Object Storage     فقط روی 127.0.0.1
#      migrator  → یک‌بار اجرا: ساخت جدول‌ها + ایندکس‌ها + RLS
#
#  دستورهای پرکاربرد:
#      docker compose ps                 وضعیت
#      docker compose logs -f app        لاگ زنده
#      docker compose restart app        ری‌استارت
#      docker compose down               توقف (داده حفظ می‌شود)
#      docker compose down -v            توقف + حذف کامل داده
#      make help                         میان‌بُرهای آماده
#
#  اجرای همراه با HTTPS خودکار (دامنه):
#      DOMAIN=edu.example.ac.ir docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# ════════════════════════════════════════════════════════════════════
name: afagh

# ── متغیرهای مشترک سرویس‌های اپ ──
# ⚠ فاز ۲ (بازبینی‌شده): DATABASE_URL مجبوراً در لنگر مشترک می‌ماند — استخرِ «مالک اسکیما»
#   در خودِ اپ (src/db/index.ts) در زمان import ساخته می‌شود و در production بدون این
#   متغیر fail-fast می‌دهد؛ پشتیبان/بازیابی درون‌فرآیندی (backup-actions) هم از همین
#   استخر استفاده می‌کند. حذفِ آن اپ را در پروداکشن از کار می‌انداخت.
#   دستاورد واقعی این فاز: AFAGH_APP_DB_PASSWORD دیگر به سرویس app تزریق نمی‌شود (فقط migrator).
#   کارِ باقی‌مانده: استخر اختصاصی فقط برای backup تا رمز مالک از app حذف شود.
x-common-env: &common-env
  # اتصال اپ با نقش محدود afagh_app (RLS فعال — توسط hardening.mjs ساخته می‌شود)
  DATABASE_URL_APP: postgres://afagh_app:${AFAGH_APP_DB_PASSWORD:?AFAGH_APP_DB_PASSWORD تنظیم نشده — رمز نقش afagh_app؛ با «./deploy-debian.sh» خودکار ساخته می‌شود}@postgres:5432/afagh_db
  DATABASE_URL: postgres://afagh:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD تنظیم نشده — «make env» را بزنید و در .env مقدار تصادفی قوی بگذارید (سیاستِ scripts/lib/secret-policy.mjs)}@postgres:5432/afagh_db
  # حالت دمو: ۱ = حساب‌های دمو فعال؛ در production حتماً ۰ (پیش‌فرض خاموش)
  AFAGH_DEMO_MODE: ${AFAGH_DEMO_MODE:-0}
  # حوزهٔ مجوز سطح-شیء برای کارشناس مالی: department (پیش‌فرض امن) | all (دسترسی به همهٔ دانشجویان)
  # فاز ۲: پیش‌فرض از all به department تغییر کرد — ریشهٔ «کارشناس مالیِ یک گروه، دانشجوی گروه دیگر را می‌دید».
  AFAGH_OBJECT_SCOPE: ${AFAGH_OBJECT_SCOPE:-department}
  # ⚠ فاز ۲: Redis با رمز بالا می‌آید (پیش‌تر بدون AUTH بود). REDIS_PASSWORD اجباری است؛
  #   deploy-debian.sh آن را خودکار می‌سازد و برای استقرارهای موجود backfill می‌کند.
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD تنظیم نشده — رمز Redis؛ «./deploy-debian.sh» خودکار می‌سازد}@redis:6379
  S3_ENDPOINT: minio
  S3_PORT: "9000"
  S3_BUCKET: ${S3_BUCKET:-afagh-archive}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-afagh}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must be set}
  # عمومی — بقیهٔ مقادیر از پنل مدیر ← «پیکربندی سامانه» قابل تنظیم‌اند
  AFAGH_UNIVERSITY_NAME: ${AFAGH_UNIVERSITY_NAME:-دانشگاه آفاق}
  AFAGH_PUBLIC_BASE_URL: ${AFAGH_PUBLIC_BASE_URL:-https://lx.afagh.ac.ir}
  AFAGH_SUPPORT_EMAIL: ${AFAGH_SUPPORT_EMAIL:-}
  AFAGH_SUPPORT_PHONE: ${AFAGH_SUPPORT_PHONE:-}
  # کوکی نشست — auto یعنی روی HTTPS «None+Secure» و روی HTTP «Lax بدون Secure»
  AFAGH_COOKIE_SECURE: ${AFAGH_COOKIE_SECURE:-true}
  AFAGH_COOKIE_SAMESITE: ${AFAGH_COOKIE_SAMESITE:-auto}
  # کلاس مجازی
  BIGBLUEBUTTON_URL: ${BIGBLUEBUTTON_URL:-}
  BIGBLUEBUTTON_SECRET: ${BIGBLUEBUTTON_SECRET:-}
  BIGBLUEBUTTON_MODERATOR_PW: ${BIGBLUEBUTTON_MODERATOR_PW:-}
  BIGBLUEBUTTON_ATTENDEE_PW: ${BIGBLUEBUTTON_ATTENDEE_PW:-}
  BIGBLUEBUTTON_AUTO_RECORD: ${BIGBLUEBUTTON_AUTO_RECORD:-false}
  MOODLE_URL: ${MOODLE_URL:-}
  MOODLE_TOKEN: ${MOODLE_TOKEN:-}
  # پیامک و ربات‌ها
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_SENDER: ${SMS_SENDER:-}
  BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
  BALE_CHANNEL_ID: ${BALE_CHANNEL_ID:-}
  EITAA_BOT_TOKEN: ${EITAA_BOT_TOKEN:-}
  EITAA_CHANNEL_ID: ${EITAA_CHANNEL_ID:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
  # درگاه پرداخت
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  PAYMENT_TERMINAL_ID: ${PAYMENT_TERMINAL_ID:-}
  PAYMENT_MERCHANT_ID: ${PAYMENT_MERCHANT_ID:-}
  PAYMENT_MERCHANT_KEY: ${PAYMENT_MERCHANT_KEY:-}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
  PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
  PAYMENT_WAGE_PERCENT: ${PAYMENT_WAGE_PERCENT:-0}
  # سرویس‌های استعلام
  IRANDOC_BASE_URL: ${IRANDOC_BASE_URL:-}
  IRANDOC_TOKEN: ${IRANDOC_TOKEN:-}
  KYC_BASE_URL: ${KYC_BASE_URL:-}
  KYC_API_KEY: ${KYC_API_KEY:-}
  SHAPARAK_BASE_URL: ${SHAPARAK_BASE_URL:-}
  SAJJAD_BASE_URL: ${SAJJAD_BASE_URL:-}
  SAJJAD_PORTAL_URL: ${SAJJAD_PORTAL_URL:-https://portal.saorg.ir}
  API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-10}
  # رمزنگاری اسرار ثمین (AES-256-GCM، hex شصت‌وچهار کاراکتری) — فقط وقتی لازم است که اتصال ثمین ثبت شود
  SAMIN_MASTER_KEY: ${SAMIN_MASTER_KEY:-}
  # کلید امضای HMAC توکن کارت/انتخاب حساب (login choice) — بدون آن «انتخاب حساب» ۵۰۰ می‌دهد
  TICKET_TOKEN_SECRET: ${TICKET_TOKEN_SECRET:-}
  PREVIOUS_TICKET_TOKEN_SECRET: ${PREVIOUS_TICKET_TOKEN_SECRET:-}
  # 🔐 امنیت (موج audit) — بدون pepper، صدور OTP امضای الکترونیک در production fail-closed است
  AFAGH_OTP_PEPPER: ${AFAGH_OTP_PEPPER:-}
  # 🔐 رمزنگاری داده‌های هویتی (کد ملی سنجش، کارت دانشجویی…). ۶۴ hex یا عبارت عبور قوی.
  #   بدون این متغیر، `piiKey()` در production خطا می‌دهد و هر مسیر PII fail-closed می‌شود
  #   (قبلاً فقط در .env بود و به کانتینر نمی‌رسید ⇒ صفحهٔ سنجش بنر قرمز می‌داد).
  #   «:?» عمداً اجباری است تا این خطا در زمان استقرار دیده شود، نه در زمان استفاده.
  #   گردش کلید: مقدار قبلی را در AFAGH_PII_KEY_PREVIOUS بگذارید تا دادهٔ قدیمی خوانده شود.
  AFAGH_PII_KEY: ${AFAGH_PII_KEY:?AFAGH_PII_KEY تنظیم نشده — کلید رمزنگاری PII (۶۴ hex یا عبارت عبور)}
  AFAGH_PII_KEY_PREVIOUS: ${AFAGH_PII_KEY_PREVIOUS:-}
  # 🔐 کلید اختصاصی امضای بکاپ SQL (حداقل ۳۲ کاراکتر تصادفی). deploy-debian.sh
  #   آن را خودکار میسازد/برای استقرارهای قدیمی backfill میکند. خالی بماند ⇒
  #   همچنان از AFAGH_PII_KEY مشتق میشود؛ تأیید امضا *هر دو* کلید را امتحان
  #   میکند، پس تنظیم/گردش این کلید بکاپهای آرشیوشده را بیاعتبار نمیکند.
  AFAGH_BACKUP_SIGNING_KEY: ${AFAGH_BACKUP_SIGNING_KEY:-}
  # کلید هدر x-cron-secret برای POST /api/cron/bi-refresh (fail-closed؛ در پنل تنظیمات هم قابل ست است)
  BI_CRON_SECRET: ${BI_CRON_SECRET:-}
  # کلید هدر x-cron-secret برای POST /api/cron/scheduled-warnings (ارسال خودکار هشدارها از پیام‌رسان‌ها)
  SCHED_WARN_CRON_SECRET: ${SCHED_WARN_CRON_SECRET:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# ─ـ شبکهٔ داخلی داده (④-⑥): postgres/redis/minio فقط روی dbnet (internal) ──
#   • کانتینرهای روی dbnet هیچ دسترسی به اینترنت ندارند (بدون default route).
#   • هاست از طریق پورت‌های 127.0.0.1 منتشرشده (DNAT) همچنان به آن‌ها می‌رسد.
#   • اپ روی هر دو شبکه است: dbnet برای دیتابیس، شبکهٔ پیش‌فرض برای اینترنت.
networks:
  dbnet:
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: afagh_pg
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: afagh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD تنظیم نشده (make env)}
      POSTGRES_DB: afagh_db
      # برای نمایش صحیح متن فارسی در مرتب‌سازی و جست‌وجو
      LANG: C.UTF-8
    # فاز ۲: کمینه‌سازی سطح حمله. postgres برای init/افت‌سطح به این capability‌ها نیاز دارد.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 512
    volumes:
      - afagh_pg:/var/lib/postgresql/data
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afagh -d afagh_db']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [dbnet]

  redis:
    image: redis:7-alpine
    container_name: afagh_redis
    restart: unless-stopped
    logging: *default-logging
    # فاز ۲: AUTH اجباری. بدون رمز، هر کاربرِ هاست یا هر کانتینر روی dbnet می‌توانست
    #   شمارندهٔ نرخ‌محدودسازی، قفل نشست و وضعیت اتاق انتظار را بخواند/دستکاری کند.
    #   رمز با «$$REDIS_PASSWORD» به sh داده می‌شود تا در Args کانتینر لو نرود.
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD تنظیم نشده — رمز Redis؛ «./deploy-debian.sh» خودکار می‌سازد}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    volumes: [afagh_redis:/data]
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [dbnet]

  minio:
    # فاز ۲: ایمیج را پین کنید تا «latest» غافلگیرکننده نباشد. مقدار پیش‌فرض همان latest
    #   است تا استقرار نشکند؛ توصیه: MINIO_IMAGE=minio/minio:RELEASE.<تاریخ>T<ساعت>Z
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: afagh_minio
    restart: unless-stopped
    logging: *default-logging
    # فاز ۲: nobody=اجبار نشد (MinIO برای نوشتن در /data به مالکیت نیاز دارد)؛ فقط esc-priv و pids
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afagh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set}
    volumes: [afagh_minio:/data]
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [dbnet]

  # یک‌بار اجرا می‌شود و تمام: ساخت/به‌روزرسانی جدول‌ها، ایندکس‌ها و RLS
  migrator:
    build:
      context: ./afagh-next
      target: migrator
    image: afagh-migrator:latest
    container_name: afagh_migrator
    restart: "no"
    logging: *default-logging
    # فاز ۲: رمز نقش afagh_app فقط این‌جا لازم است (hardening.mjs آن را روی نقش اعمال
    #   می‌کند). DATABASE_URL (مالک اسکیما) از لنگر مشترک می‌آید.
    environment:
      <<: *common-env
      AFAGH_APP_DB_PASSWORD: ${AFAGH_APP_DB_PASSWORD:?AFAGH_APP_DB_PASSWORD تنظیم نشده — رمز نقش afagh_app}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    volumes:
      # M-2: کلیدهای پویش‌ها (cron.env) برای scheduler تولید و به اشتراک گذاشته می‌شود
      - afagh_cron_secrets:/secrets
      # P0-2: پشتیبان پیش از استقرار باید زنده بماند. پیش از این /backups فقط داخل
      #   فایل‌سیستم کانتینر یک‌بارمصرف migrator بود و با `down` حذف می‌شد.
      #   برای بردن پشتیبان بیرون از سرور، مسیر میزبان را بدهید:
      #     AFAGH_BACKUP_DIR=/var/backups/afagh  (و این volume را bind کنید)
      - afagh_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dbnet]

  app:
    build:
      context: ./afagh-next
      target: runner
      args:
        # روی سرور کم‌حافظه کمترش کنید (مثلاً 1536) — .env: NODE_MAX_OLD_SPACE=1536
        # بیلد با «exit code: 137» = OOM است: swap بسازید و این مقدار را کم کنید.
        NODE_MAX_OLD_SPACE: ${NODE_MAX_OLD_SPACE:-2048}
        # آرگومان اضافهٔ next build — مثلاً NEXT_BUILD_ARGS=--webpack
        NEXT_BUILD_ARGS: ${NEXT_BUILD_ARGS:-}
        # P0-4: حساب‌های دمو با رمز شناخته‌شده در ایمیج تولید قفل‌اند. فقط برای
        # ایمیج نمایشی باز کنید:  AFAGH_DEMO_LOCK=0 make build
        AFAGH_DEMO_LOCK: ${AFAGH_DEMO_LOCK:-1}
    image: afagh-app:latest
    container_name: afagh_app
    restart: unless-stopped
    logging: *default-logging
    # فاز ۲: app دیگر رمز مالک اسکیما (DATABASE_URL) و AFAGH_APP_DB_PASSWORD را نمی‌گیرد؛
    #   فقط لنگر مشترک (DATABASE_URL_APP + تنظیمات). اسرار کمتری در `docker inspect`.
    environment: *common-env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    volumes:
      - afagh_uploads:/app/public/uploads
    # فاز ۲: به‌طور پیش‌فرض فقط روی 127.0.0.1 منتشر می‌شود (پشت Caddy/پروکسی).
    #   برای انتشار عمومی صریح: APP_BIND=0.0.0.0 (فقط وقتی خودتان HTTP/TLS را مدیریت می‌کنید).
    ports: ['${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - dbnet
      - default

  # پویش‌های زمان‌بندی‌شده را صدا می‌زند (یادآوری چک، فارغ‌التحصیلی، BI، گردش کار).
  # بدون این سرویس endpoint‌های /api/cron/* هرگز خودکار اجرا نمی‌شوند.
  scheduler:
    image: alpine:3.20
    container_name: afagh_scheduler
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/scheduler.sh:/scheduler.sh:ro
      # M-2: کلیدهای تولیدشده توسط migrator (seed-base) — ENV روی آن مقدم است
      - afagh_cron_secrets:/secrets:ro
    entrypoint: ["sh", "/scheduler.sh"]
    # فاز ۲: کلیدهای پویش دیگر در ENV تزریق نمی‌شوند (در `docker inspect` دیده می‌شدند).
    #   scheduler آن‌ها را از فایل volume «/secrets/cron.env» می‌خواند که migrator
    #   (seed-base) هنگام نصب می‌سازد و همان مقادیر در دیتابیس هم ثبت شده‌اند.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    environment:
      APP_URL: http://app:8080
      # فاصلهٔ پویش‌ها به دقیقه — همه از ENV، هیچ‌کدام در کد سخت‌کد نیست
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
      CHEQUE_REMIND_INTERVAL_MIN: ${CHEQUE_REMIND_INTERVAL_MIN:-60}
      GRAD_SCAN_INTERVAL_MIN: ${GRAD_SCAN_INTERVAL_MIN:-1440}
      BI_REFRESH_INTERVAL_MIN: ${BI_REFRESH_INTERVAL_MIN:-720}
      WORKFLOW_EVENTS_INTERVAL_MIN: ${WORKFLOW_EVENTS_INTERVAL_MIN:-60}
      GREETINGS_INTERVAL_MIN: ${GREETINGS_INTERVAL_MIN:-1440}
      SCHED_WARNINGS_INTERVAL_MIN: ${SCHED_WARNINGS_INTERVAL_MIN:-15}
    depends_on:
      app:
        condition: service_started

volumes:
  afagh_pg:
  afagh_redis:
  afagh_minio:
  afagh_uploads:
  # P0-2: پوشهٔ ماندگار پشتیبان‌ها (pg_dump -Fc + امضای sha256 + فایل LATEST)
  afagh_backups:
  # M-2: کلیدهای پویش‌های زمان‌بندی‌شده (تولید migrator، مصرف scheduler)
  afagh_cron_secrets:
