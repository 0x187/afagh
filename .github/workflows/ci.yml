name: CI
on:
  push: { branches: [main, FINAL] }
  pull_request:

jobs:
  afagh-next:
    name: کالبد — تایپ، تست و بیلد
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: afagh-next } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: afagh-next/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test        # M-6: تست‌های واحد با tsx روی Node 20 هم اجرا می‌شوند
      - run: node scripts/audit-actions.mjs   # P0: هیچ Server Action بدون گارد نماند
      - run: npm run build   # بدون نیاز به سرویس‌ها (اتصال DB تنبل است)
      # Engineering review (P1): security scan in CI — high-severity findings fail the build
      # (audit-level=high; on registry outages it fails loudly instead of silently passing)
      - run: node scripts/ci-audit.mjs   # npm audit مقاوم: فقط یافتهٔ واقعی high/critical؛ خرابی endpoint رجیستری → هشدار

  rls-integration:
    name: RLS — اثبات جداسازی سطری (P0)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: afagh-next } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afagh
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: afagh_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afagh -d afagh_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Doc step 2: ZSET waiting room — integration test against a real Redis
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://afagh:test-password@127.0.0.1:5432/afagh_db
      DATABASE_URL_APP: postgres://afagh_app:test-app-password@127.0.0.1:5432/afagh_db
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: afagh-next/package-lock.json }
      - run: npm ci
      # The afagh_app role must exist before migrations run: the RLS migrations
      # (0058/0061/0063/0099) create FOR ... TO afagh_app policies, which fail
      # with 42704 on a fresh database (CI / first deploy) where the role does
      # not exist yet. hardening.mjs sets the password/grants afterwards (idempotent).
      - run: |
          PGPASSWORD=test-password psql "postgres://afagh:test-password@127.0.0.1:5432/afagh_db" \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE afagh_app LOGIN PASSWORD 'test-app-password' NOSUPERUSER NOBYPASSRLS"
      # Mirrors the production migrator pipeline: schema -> patches -> seed data -> hardening
      - run: AFAGH_BACKUP_DIR="$RUNNER_TEMP/backups" node scripts/migrate-db.mjs   # مهاجرت‌های نسخه‌دار (بکاپ→migrate→verify) به‌جای push --force
      - run: node scripts/apply-patches.mjs
      - run: node scripts/seed-base.mjs
      - run: AFAGH_APP_DB_PASSWORD=test-app-password node scripts/hardening.mjs
      # P0 proof: user A never sees or mutates user B's data
      - run: node scripts/rls-test.mjs
      # P1 proof (review): concurrency race — approval/settlement has exactly one winner
      - run: node scripts/concurrency-test.mjs
      # Doc step 2: ZSET waiting room — O(log N) position against a real Redis
      - run: npx tsx scripts/waiting-room-zset.test.mts

  afagh-erp:
    name: فاز صفر — سلامت کد
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: afagh-erp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: afagh-erp/package-lock.json }
      - run: npm ci
      - run: find src -name '*.js' -exec node --check {} \;

  backend-go:
    name: بک‌ند Go — بیلد، vet و تست
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend-go/go.mod, cache-dependency-path: backend-go/go.sum }
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out   # فرمت استاندارد
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend-react:
    name: فرانت React — تایپ، تست و بیلد
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend-react } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend-react/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  backend-go-staticcheck:
    name: بک‌ند Go — staticcheck (صفر یافته)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend-go/go.mod }
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  backend-go-gosec:
    name: بک‌ند Go — gosec (گزارشی، مسدودکننده نیست)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults: { run: { working-directory: backend-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend-go/go.mod }
      - run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -severity medium -confidence medium ./...
